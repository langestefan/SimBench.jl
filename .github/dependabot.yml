# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
version: 2
enable-beta-ecosystems: true
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      # Dependency bumps carry no user-visible change, so the changelog gate skips them.
      - "skip-changelog"
      - "dependencies"
  - package-ecosystem: "julia"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "skip-changelog"
      - "dependencies"
