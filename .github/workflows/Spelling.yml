name: Spell Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  typos-check:
    name: Spell Check with Typos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Actions Repository
        uses: actions/checkout@v7
      - name: Check spelling
        # Pinned to the v1.48.0 release commit. Tracking master breaks whenever
        # upstream bumps its version reference before publishing the release binaries.
        uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1
        with:
          config: .typos.toml
