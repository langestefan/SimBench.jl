name: Spell Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  typos-check:
    name: Spell Check with Typos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Actions Repository
        uses: actions/checkout@v7
      - name: Check spelling
        # Pinned to the v1.48.0 release commit. Tracking master breaks whenever
        # upstream bumps its version reference before publishing the release binaries.
        uses: crate-ci/typos@d43b6c087ac471e2ea7b8af622ff15f05c0c365b # v1.50.1
        with:
          config: .typos.toml
