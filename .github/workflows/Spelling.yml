name: Spell Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  typos-check:
    name: Spell Check with Typos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Actions Repository
        uses: actions/checkout@v7
      - name: Check spelling
        # Pinned to the v1.48.0 release commit. Tracking master breaks whenever
        # upstream bumps its version reference before publishing the release binaries.
        uses: crate-ci/typos@8a48f81b6c64dcfea44b3633223084c4be58ac5f # v1.49.0
        with:
          config: .typos.toml
